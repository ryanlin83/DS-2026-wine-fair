
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🍷 紅酒商品查詢系統 - 僅限鼎山店使用</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
body {
  font-family: "Microsoft JhengHei", sans-serif;
  background: #f9f5f2;
  margin: 0;
  padding: 0;
  text-align: center;
}

/* ===== Banner ===== */
header {
  margin-top: 10px;
}
header img {
  width: 300px;
  max-width: 90%;
  height: auto;
  display: block;
  margin: 10px auto;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  border-radius: 12px;
}
h1 {
  color: #6b0f1a;
  font-weight: 700;
  font-size: 1.8em;
  margin-bottom: 10px;
}

/* ===== Container ===== */
.container {
  background: #fff;
  padding: 20px;
  margin: 15px auto;
  max-width: 1000px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

textarea {
  width: 90%;
  max-width: 600px;
  height: 70px;
  border-radius: 8px;
  border: 1px solid #ccc;
  padding: 10px;
  resize: none;
  font-size: 1em;
  box-sizing: border-box;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
}
button {
  background: #6b0f1a;
  color: #fff;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1em;
  transition: background 0.2s;
}
button:hover {
  background: #8b1e2d;
}

.note {
  color: #555;
  font-size: 0.95em;
  margin-top: 8px;
}
.tip {
  color: #8b1e2d;
  font-size: 0.55em;
  margin-top: 5px;
  font-weight: 600;
  text-align: center;
  line-height: 1.4em;
}

/* ===== 查詢中提示：無影片 ===== */
#loading {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255,255,255,0.9);
  z-index: 9999;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

/* ===== 查詢完成提示框：無影片 ===== */
#doneModal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255,255,255,0.95);
  z-index: 10000;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}
#doneModal button {
  margin-top: 15px;
  padding: 8px 16px;
  border: none;
  border-radius: 8px;
  background: #6b0f1a;
  color: #fff;
  cursor: pointer;
}

/* ===== Table ===== */
table {
  width: 100%;
  max-width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  font-size: 0.95em;
}
th, td {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: center;
  vertical-align: middle;
  word-break: break-word;
}
th {
  background: #f2e5df;
  color: #6b0f1a;
  font-weight: bold;
}

/* 條碼圖靠左 */
th:nth-last-child(1),
td[data-label="條碼圖"] {
  text-align: left !important;
}

/* 條碼尺寸 */
.barcode-img {
  width: 100%;
  max-width: 180px;
  height: auto;
  display: block;
  margin: 0 auto;
}

/* 商品位置 */
td[data-label="商品位置"] {
  font-size: 1.2em;
  font-weight: 600;
  color: #3b0d0d;
  word-break: break-word;
}

/* ===== 手機版 ===== */
@media (max-width: 768px) {
  table, thead, tbody, th, td, tr {
    display: block;
  }
  thead {
    display: none;
  }

  tr {
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    background: #fffaf9;
  }

  td {
    text-align: left;
    padding: 6px 10px;
    border: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  td::before {
    content: attr(data-label);
    font-weight: bold;
    color: #6b0f1a;
    flex: 0 0 40%;
  }

  td[data-label="條碼圖"] {
    display: block !important;
    text-align: left !important;
    padding: 8px 12px;
  }
  td[data-label="條碼圖"]::before {
    display: block;
    text-align: left;
    margin-bottom: 4px;
  }
  td[data-label="條碼圖"] img.barcode-img {
    width: 90%;
    height: auto;
    max-height: 200px;
    display: block;
    margin: 0 auto;
  }

  td[data-label="商品位置"] {
    font-size: 1em;
  }

  input[type="number"] {
    width: 100px;
    box-sizing: border-box;
  }

  .tip {
    font-size: 0.9em;
    color: #a1122a;
    font-weight: 700;
    margin-top: 10px;
  }
}
</style>
</head>

<body>

<header>
  <img src="wine-logo.jpg" alt="Wine Logo">
  <h1>🍷 紅酒商品查詢系統 - 僅限鼎山店使用</h1>
</header>

<div class="container">
  <h3>請輸入紅酒DM商品「訂購編號」（例如：01-01 或多筆 04-06-02, 07-08-01）</h3>

  <textarea id="orderInput" placeholder="輸入訂購編號..."></textarea>

  <div class="buttons">
    <button id="searchBtn" type="button">查詢</button>
    <button id="clearBtn" type="button">清空查詢</button>
  </div>

  <div class="note">為確保查詢系統的操作體驗，單次最多查詢支數請以5支為限。</div>

  <div class="tip">
    📸 可在「數量」欄位填上想購買的數量後，<br>
    即可截圖此畫面，結帳時將此截圖提供給服務人員。
  </div>

  <div id="result"></div>
</div>

<!-- 查詢中提示：只顯示文字 -->
<div id="loading">
  <div style="color:#6b0f1a;font-weight:600;margin-top:10px;">
    資料查詢中，請稍候…
  </div>
</div>

<!-- 查詢完成提示框：只顯示文字 -->
<div id="doneModal">
  <div style="color:#6b0f1a;font-weight:600;margin-top:10px;font-size:1.2em;">
    查詢已完成 🎉
  </div>
  <button id="closeDoneModal" type="button">關閉</button>
</div>

<script>
const JSON_URL = "data/wine-data.json";

const searchBtn = document.getElementById("searchBtn");
const clearBtn = document.getElementById("clearBtn");
const loading = document.getElementById("loading");
const resultDiv = document.getElementById("result");
const orderInput = document.getElementById("orderInput");

let cachedData = null;

// 查詢完成提示框
const doneModal = document.getElementById("doneModal");
const closeDoneModal = document.getElementById("closeDoneModal");
let doneTimer = null;

// 手動關閉查詢完成提示
closeDoneModal.addEventListener("click", () => {
  doneModal.style.display = "none";
  if (doneTimer) {
    clearTimeout(doneTimer);
    doneTimer = null;
  }
});

// 載入商品 JSON 資料
async function loadData() {
  if (cachedData) {
    return cachedData;
  }

  const response = await fetch(JSON_URL + "?t=" + Date.now());

  if (!response.ok) {
    throw new Error(
      "商品資料載入失敗，HTTP 狀態碼：" + response.status
    );
  }

  const data = await response.json();

  if (!Array.isArray(data)) {
    throw new Error("商品資料格式錯誤，預期應為 JSON 陣列。");
  }

  cachedData = data;
  return cachedData;
}

// 查詢功能
searchBtn.addEventListener("click", async () => {
  const input = orderInput.value.trim();

  if (!input) {
    alert("請輸入至少一個訂購編號！");
    return;
  }

  const codes = input.split(/[\n,，\s]+/).filter(Boolean);

  if (codes.length > 5) {
    alert("⚠ 每次最多查詢 5 筆商品，請減少查詢數量。");
    return;
  }

  // 避免重複顯示舊提示
  if (doneTimer) {
    clearTimeout(doneTimer);
    doneTimer = null;
  }
  doneModal.style.display = "none";

  loading.style.display = "flex";
  resultDiv.innerHTML = "";

  try {
    const data = await loadData();

    const results = data.filter(item =>
      codes.includes(String(item["訂購編號"] ?? "").trim())
    );

    if (results.length === 0) {
      resultDiv.innerHTML =
        '<p style="color:red;">查無資料，請確認訂購編號是否正確。</p>';
      return;
    }

    let tableHTML = "<table><thead><tr>";
    const headers = Object.keys(results[0]);

    headers.forEach(header => {
      tableHTML += `<th>${header}</th>`;
    });

    tableHTML += "<th>數量</th><th>條碼圖</th></tr></thead><tbody>";

    results.forEach(item => {
      tableHTML += "<tr>";

      headers.forEach(header => {
        const value = item[header] ?? "";
        const cell = document.createElement("span");
        cell.textContent = String(value);

        // 使用 HTML 轉義，避免商品資料中的特殊字元破壞版面
        const safeValue = String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");

        tableHTML += `<td data-label="${String(header)
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")}">${safeValue}</td>`;
      });

      tableHTML +=
        '<td data-label="數量"><input type="number" min="0" step="1" placeholder="0" aria-label="購買數量"></td>';

      const code = String(item["條碼"] ?? "").trim();

      const barcode = /^\d{13}$/.test(code)
        ? `<img class="barcode-img" src="https://barcodeapi.org/api/ean13/${code}?height=60" alt="商品條碼" loading="lazy">`
        : "";

      tableHTML += `<td data-label="條碼圖">${barcode}</td></tr>`;
    });

    tableHTML += "</tbody></table>";
    resultDiv.innerHTML = tableHTML;

    // 顯示查詢完成提示框
    doneModal.style.display = "flex";

    // 3 秒後自動關閉
    doneTimer = setTimeout(() => {
      doneModal.style.display = "none";
      doneTimer = null;
    }, 3000);

  } catch (error) {
    console.error("商品查詢錯誤：", error);

    resultDiv.innerHTML =
      '<p style="color:red;">商品資料載入失敗，請確認網路連線及 data/wine-data.json 檔案是否存在。</p>';

    alert("查詢時發生錯誤，請稍後再試。\n" + error.message);

  } finally {
    loading.style.display = "none";
  }
});

// 清空查詢
clearBtn.addEventListener("click", () => {
  orderInput.value = "";
  resultDiv.innerHTML = "";
  doneModal.style.display = "none";

  if (doneTimer) {
    clearTimeout(doneTimer);
    doneTimer = null;
  }
});
</script>

</body>
</html>
